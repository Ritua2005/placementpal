<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlacementPal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <h2 class="logo">PlacementPal</h2>
      <nav>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Applications</a>
        <a href="#">Interview Prep</a>
        <a href="#">Calendar</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>Dashboard</h1>
        <button class="btn">+ Add Application</button>
      </header>
            <section class="stats">
        <div class="card"><p>Total Applied</p><h3>24</h3></div>
        <div class="card"><p>Interviews</p><h3>5</h3></div>
        <div class="card"><p>Offers</p><h3>1</h3></div>
        <div class="card"><p>Rejected</p><h3>8</h3></div>
      </section>

      <section class="board">
        <div class="column">
          <h3>Applied</h3>
          <div class="job-card">
            <h4>Frontend Developer</h4>
            <p>Infosys · Bengaluru</p>
          </div>
        </div>
        <div class="column"><h3>Online Test</h3></div>
        <div class="column"><h3>Interview</h3></div>
        <div class="column"><h3>Offer</h3></div>
      </section>
    </main>

  </div>
</body>
</html>
